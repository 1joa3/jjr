    <!-- Estilos da tela de carregamento (inline para aparecer antes de qualquer outro arquivo) -->
    <style>
      #preloader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #ffffff;
        transition: opacity 500ms ease, visibility 500ms ease;
      }
      #preloader.is-hidden { opacity: 0; visibility: hidden; }
      .pl-mark { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .pl-blocks { display: flex; gap: 4px; }
      .pl-blocks span {
        width: 42px; height: 48px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(#0e4ba8, #0b1b38);
        color: #fff; font: 500 30px 'Trirong', Georgia, serif;
        opacity: 0; transform: translateY(10px);
        animation: pl-in 600ms cubic-bezier(.22,1,.36,1) forwards;
      }
      .pl-blocks span:nth-child(2) { animation-delay: 120ms; }
      .pl-blocks span:nth-child(3) { animation-delay: 240ms; }
      .pl-name {
        font: 500 11px 'Trirong', Georgia, serif; letter-spacing: .32em; color: #0b1b38;
        opacity: 0; animation: pl-fade 600ms 380ms ease forwards;
      }
      .pl-bar { width: 132px; height: 2px; margin-top: 8px; background: #e2e8f0; overflow: hidden; border-radius: 2px; }
      .pl-bar::after {
        content: ""; display: block; width: 40%; height: 100%; background: #0e4ba8;
        animation: pl-bar 1.1s ease-in-out infinite;
      }
      @keyframes pl-in { to { opacity: 1; transform: none; } }
      @keyframes pl-fade { to { opacity: 1; } }
      @keyframes pl-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        .pl-blocks span, .pl-name { animation: none; opacity: 1; transform: none; }
        .pl-bar::after { animation: none; width: 100%; }
      }
    </style>
    <!-- Sem JavaScript: não mostra a tela de carregamento nem esconde conteúdo animado -->
    <noscript><style>#preloader { display: none; } .reveal { opacity: 1 !important; transform: none !important; }</style></noscript>
